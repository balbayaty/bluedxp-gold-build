openapi: 3.0.0
info:
  title: QHSE Module API
  description: Comprehensive API for Quality, Health, Safety, and Environment management
  version: 1.0.0
  contact:
    name: BlueDXP Platform
    email: support@bluedxp.com

servers:
  - url: /api/qhse
    description: QHSE API Base URL

tags:
  - name: Incidents
    description: Incident management endpoints
  - name: Inspections
    description: Inspection management endpoints
  - name: Training
    description: Training management endpoints
  - name: Reports
    description: Reporting and analytics endpoints
  - name: Integration
    description: Cross-module integration endpoints
  - name: Bulk Operations
    description: Bulk operation endpoints
  - name: Search
    description: Advanced search endpoints
  - name: Webhooks
    description: Webhook management endpoints
  - name: Approvals
    description: Approval workflow endpoints

paths:
  /incidents:
    get:
      tags: [Incidents]
      summary: Get incidents
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of incidents
    post:
      tags: [Incidents]
      summary: Create incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incident'
      responses:
        '201':
          description: Incident created

  /bulk:
    post:
      tags: [Bulk Operations]
      summary: Execute bulk operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum: [CREATE_INCIDENTS, ASSIGN_TRAINING, SCHEDULE_INSPECTIONS, UPDATE_STATUS]
                data:
                  type: array
                createdBy:
                  type: string
      responses:
        '200':
          description: Bulk operation completed

  /search:
    get:
      tags: [Search]
      summary: Search QHSE data
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: types
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Search results

  /webhooks:
    post:
      tags: [Webhooks]
      summary: Register webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [register, test]
                name:
                  type: string
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook registered

components:
  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
        incidentNumber:
          type: string
        title:
          type: string
        type:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
        location:
          type: string
        occurredAt:
          type: string
          format: date-time









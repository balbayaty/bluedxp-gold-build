apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-lifecycle-service
  namespace: process-lifecycle
  labels:
    app: process-lifecycle
    service: lifecycle
spec:
  replicas: 3
  selector:
    matchLabels:
      app: process-lifecycle
      service: lifecycle
  template:
    metadata:
      labels:
        app: process-lifecycle
        service: lifecycle
    spec:
      containers:
      - name: lifecycle-service
        image: bluedxp/process-lifecycle:latest
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: process-lifecycle-secrets
              key: redis-url
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: process-lifecycle-secrets
              key: postgres-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: process-lifecycle-service
  namespace: process-lifecycle
spec:
  selector:
    app: process-lifecycle
    service: lifecycle
  ports:
  - port: 80
    targetPort: 3002
    protocol: TCP
  type: LoadBalancer












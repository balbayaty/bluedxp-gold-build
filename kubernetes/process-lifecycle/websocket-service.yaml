apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  namespace: process-lifecycle
  labels:
    app: process-lifecycle
    service: websocket
spec:
  replicas: 3
  selector:
    matchLabels:
      app: process-lifecycle
      service: websocket
  template:
    metadata:
      labels:
        app: process-lifecycle
        service: websocket
    spec:
      containers:
      - name: websocket-service
        image: bluedxp/websocket-service:latest
        ports:
        - containerPort: 3010
          name: websocket
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: process-lifecycle-secrets
              key: redis-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-service
  namespace: process-lifecycle
spec:
  selector:
    app: process-lifecycle
    service: websocket
  ports:
  - port: 80
    targetPort: 3010
    protocol: TCP
  type: LoadBalancer












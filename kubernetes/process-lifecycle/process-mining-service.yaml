apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-mining-service
  namespace: process-lifecycle
  labels:
    app: process-lifecycle
    service: process-mining
spec:
  replicas: 2
  selector:
    matchLabels:
      app: process-lifecycle
      service: process-mining
  template:
    metadata:
      labels:
        app: process-lifecycle
        service: process-mining
    spec:
      containers:
      - name: process-mining-service
        image: bluedxp/process-mining-service:latest
        ports:
        - containerPort: 3004
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: ELASTICSEARCH_URL
          valueFrom:
            secretKeyRef:
              name: process-lifecycle-secrets
              key: elasticsearch-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: process-mining-service
  namespace: process-lifecycle
spec:
  selector:
    app: process-lifecycle
    service: process-mining
  ports:
  - port: 80
    targetPort: 3004
    protocol: TCP












apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: process-lifecycle
  labels:
    app: process-lifecycle
    service: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: process-lifecycle
      service: ai
  template:
    metadata:
      labels:
        app: process-lifecycle
        service: ai
    spec:
      containers:
      - name: ai-service
        image: bluedxp/ai-service:latest
        ports:
        - containerPort: 3005
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: process-lifecycle-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: process-lifecycle-secrets
              key: anthropic-api-key
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: process-lifecycle
spec:
  selector:
    app: process-lifecycle
    service: ai
  ports:
  - port: 80
    targetPort: 3005
    protocol: TCP












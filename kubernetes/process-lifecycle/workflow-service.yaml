apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: process-lifecycle
  labels:
    app: process-lifecycle
    service: workflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: process-lifecycle
      service: workflow
  template:
    metadata:
      labels:
        app: process-lifecycle
        service: workflow
    spec:
      containers:
      - name: workflow-service
        image: bluedxp/workflow-service:latest
        ports:
        - containerPort: 3003
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: EVENT_BUS_URL
          value: "amqp://rabbitmq:5672"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: process-lifecycle
spec:
  selector:
    app: process-lifecycle
    service: workflow
  ports:
  - port: 80
    targetPort: 3003
    protocol: TCP












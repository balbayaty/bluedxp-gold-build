<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flexGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8533;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- FLEX Text -->
  <text 
    x="10" 
    y="38" 
    font-family="Arial, sans-serif" 
    font-size="36" 
    font-weight="bold" 
    fill="url(#flexGradient)"
    transform="skewX(-5)"
  >
    FLEX
  </text>
  
  <!-- Tagline -->
  <text 
    x="10" 
    y="52" 
    font-family="Arial, sans-serif" 
    font-size="9" 
    font-weight="300" 
    fill="#CCCCCC"
    transform="skewX(-5)"
    letter-spacing="1px"
  >
    EMPOWERING LOGISTICS
  </text>
  
  <!-- Optional: Add a subtle accent line -->
  <line 
    x1="10" 
    y1="45" 
    x2="120" 
    y2="45" 
    stroke="url(#flexGradient)" 
    stroke-width="2" 
    opacity="0.3"
  />
</svg>


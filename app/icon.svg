<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #0082fe; }
      .pattern { fill: #ffffff; opacity: 0.95; }
    </style>
  </defs>
  <!-- Background with rounded corners -->
  <rect class="bg" width="64" height="64" rx="12"/>
  <!-- Simplified BlueDXP geometric pattern - optimized for small sizes -->
  <g class="pattern">
    <!-- Main diamond grid pattern -->
    <rect x="20" y="18" width="6" height="6" transform="rotate(45 23 21)"/>
    <rect x="30" y="18" width="6" height="6" transform="rotate(45 33 21)"/>
    <rect x="38" y="18" width="6" height="6" transform="rotate(45 41 21)"/>
    <rect x="20" y="26" width="6" height="6" transform="rotate(45 23 29)"/>
    <rect x="30" y="26" width="6" height="6" transform="rotate(45 33 29)"/>
    <rect x="38" y="26" width="6" height="6" transform="rotate(45 41 29)"/>
    <rect x="20" y="34" width="6" height="6" transform="rotate(45 23 37)"/>
    <rect x="30" y="34" width="6" height="6" transform="rotate(45 33 37)"/>
    <rect x="38" y="34" width="6" height="6" transform="rotate(45 41 37)"/>
    <!-- Accent pattern -->
    <rect x="25" y="22" width="6" height="6" transform="rotate(45 28 25)"/>
    <rect x="35" y="22" width="6" height="6" transform="rotate(45 38 25)"/>
    <rect x="25" y="30" width="6" height="6" transform="rotate(45 28 33)"/>
    <rect x="35" y="30" width="6" height="6" transform="rotate(45 38 33)"/>
  </g>
</svg>
